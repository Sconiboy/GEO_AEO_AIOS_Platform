[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-aeo-aios-platform"
version = "0.1.0"
description = "GEO/AEO Commercial Optimization & Tracking Platform (AIOS)"
authors = [
    { name = "Antigravity", email = "antigravity@gemini.local" },
    { name = "Manus AI", email = "manus@research.local" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
