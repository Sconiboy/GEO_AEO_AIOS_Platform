name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mypy Type Check
        run: |
          mypy src

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src tests/

      - name: Test CLI Fixture Runner
        run: |
          python -m src.cli audit --fixture data/fixtures/sample_audit.json --output reports/ci_test_report.md
